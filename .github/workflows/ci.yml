name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reservations
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
